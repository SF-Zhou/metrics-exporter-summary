name: Publish to crates.io

on:
  push:
    tags: ['v*']

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install publishing toolchain
        # Publishing a workspace requires Cargo 1.90 or newer.
        run: rustup toolchain install stable --profile minimal

      - name: Check release version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          expected = "v" + manifest["workspace"]["package"]["version"]
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} does not match {expected!r}")
          PY

      - name: Resolve dependencies for this release
        run: cargo +stable generate-lockfile

      - name: Verify workspace publication
        run: cargo +stable publish --workspace --all-features --locked --registry crates-io --dry-run

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish workspace
        run: cargo +stable publish --workspace --all-features --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

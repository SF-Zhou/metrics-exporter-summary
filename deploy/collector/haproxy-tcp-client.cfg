# Optional TLS tunnel on each sending host. RemoteSink uses tcp://127.0.0.1:19092
# and the collector bearer token. Direct TCP deployments do not need this tunnel.
global
    log stdout format raw local0
    maxconn 256
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    timeout connect 3s
    timeout client 35s
    timeout server 35s
    timeout queue 5s

frontend local_summary
    bind 127.0.0.1:19092
    default_backend authenticated_summary

backend authenticated_summary
    server collector collector.example.internal:9444 ssl crt /etc/haproxy/tls/client.pem ca-file /etc/haproxy/tls/collector-ca.pem verify required verifyhost collector.example.internal sni str(collector.example.internal)

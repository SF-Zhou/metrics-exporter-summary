# Optional HAProxy 2.8+ TLS template. Substitute certificate paths and public ports.
# These backends use a collector bound to loopback in the same network namespace.
# Validate with: haproxy -c -f /etc/haproxy/haproxy.cfg
# PEM files contain the certificate chain and private key; keep them mode 0600.
global
    log stdout format raw local0
    maxconn 512
    tune.bufsize 16384
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    timeout connect 3s
    timeout client 35s
    timeout server 35s
    timeout queue 5s

frontend summary_https
    mode http
    bind :9443 ssl crt /etc/haproxy/tls/collector.pem
    option httplog
    timeout http-request 10s
    timeout http-keep-alive 10s
    maxconn 256
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 8388608 }
    default_backend summary_http

backend summary_http
    mode http
    # Authorization is forwarded unchanged. Never add it to captured log headers.
    server collector 127.0.0.1:9091 maxconn 256 check

frontend summary_tls_tcp
    mode tcp
    # TCP TLS tunnels additionally authenticate the client certificate.
    bind :9444 ssl crt /etc/haproxy/tls/collector.pem ca-file /etc/haproxy/tls/clients-ca.pem verify required
    maxconn 256
    default_backend summary_tcp

backend summary_tcp
    mode tcp
    server collector 127.0.0.1:9092 maxconn 256 check
